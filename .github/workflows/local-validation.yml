name: Local E2E attestation verifier

# Privileged steps use trusted default-branch code only. Pull request heads are fetched as Git
# objects for verification and are never checked out, built or run.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] default-branch code only; PR code is never executed
    types: [created, edited, deleted]
  pull_request_target: # zizmor: ignore[dangerous-triggers] restricted to trusted main as the base branch
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - '.github/local-validation/**'
      - '.github/workflows/local-validation.yml'
      - 'scripts/local-validation/agentscm-rnqc.patch'
      - 'scripts/local-validation/build-agentscm.sh'
      - 'scripts/local-validation/invalidate-heads.sh'
      - 'scripts/local-validation/reconcile-heads.sh'
  schedule:
    - cron: '17 6 * * *'

permissions: {}

env:
  AGENTSCM_REVISION: 24b70c0796e8288d1560adda36a1590e613d0ffc
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request && (startsWith(github.event.comment.body, '<!-- agentscm-local-validation:v1 ') || (github.event.action == 'edited' && startsWith(github.event.changes.body.from, '<!-- agentscm-local-validation:v1 '))) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) }}
    # GitHub keeps at most one pending job per group. Only eligible status writers enter the group,
    # and every surviving writer reconciles every supported open PR.
    concurrency:
      group: local-e2e-attestation-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Invalidate every supported head before setup
        id: invalidate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/invalidate-heads.sh" <<'INVALIDATE_SCRIPT'
          #!/usr/bin/env bash

          set -euo pipefail

          : "${GH_TOKEN:?GH_TOKEN is required}"
          : "${REPO:?REPO is required}"
          : "${DEFAULT_BRANCH:?DEFAULT_BRANCH is required}"
          : "${RUN_URL:?RUN_URL is required}"

          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/rnqc-invalidate.XXXXXX")
          trap 'rm -rf "$work"' EXIT

          gh api --paginate --slurp "repos/$REPO/pulls?state=open&base=$DEFAULT_BRANCH&per_page=100" > "$work/pages.json"
          jq -e 'type == "array" and all(.[]; type == "array")' "$work/pages.json" >/dev/null
          jq -c --arg base "$DEFAULT_BRANCH" '
            flatten
            | map(select(.base.ref == $base) | {number, head: .head.sha})
            | if length > 1000 then error("more than 1000 supported open pull requests") else . end
            | if all(.[]; (.number | type == "number") and (.head | test("^[0-9a-f]{40}$"))) then . else error("invalid pull request response") end
          ' "$work/pages.json" > "$work/pulls.json"

          jq -r 'map(.head) | unique[]' "$work/pulls.json" > "$work/heads.txt"
          while IFS= read -r head; do
            [[ -n $head ]] || continue
            gh api --method POST "repos/$REPO/statuses/$head" \
              -f state=pending \
              -f context=agentscm/local-validation \
              -f description='reconciling trusted local E2E attestations' \
              -f target_url="$RUN_URL" >/dev/null
          done < "$work/heads.txt"

          echo "invalidated $(wc -l < "$work/heads.txt" | tr -d ' ') supported head(s)"
          INVALIDATE_SCRIPT
          chmod 0755 "$RUNNER_TEMP/invalidate-heads.sh"
          "$RUNNER_TEMP/invalidate-heads.sh"

      - name: Check out trusted RNQC verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          path: repository

      - name: Check out pinned AgentSCM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: counterbranch/agentscm
          ref: ${{ env.AGENTSCM_REVISION }}
          fetch-depth: 1
          persist-credentials: false
          path: agentscm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore AgentSCM build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agentscm
          cache-on-failure: true

      - name: Build pinned RNQC-compatible AgentSCM
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/agentscm/target
        run: repository/scripts/local-validation/build-agentscm.sh agentscm "$RUNNER_TEMP/agentscm"

      - name: Reconcile every supported open PR
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENTSCM_BIN: ${{ runner.temp }}/agentscm
        working-directory: repository
        run: scripts/local-validation/reconcile-heads.sh

      - name: Leave every supported head pending after failure
        if: ${{ always() && steps.reconcile.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -x "$RUNNER_TEMP/invalidate-heads.sh" ]] || {
            echo "pre-setup invalidator was not materialized" >&2
            exit 1
          }
          "$RUNNER_TEMP/invalidate-heads.sh"
